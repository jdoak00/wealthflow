<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#4a90d9"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Správa účtu"/>
  <title>Správa účtu a investic</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;background:#d6d0c8;}
    body{font-family:'DM Sans',sans-serif;}
    #root{max-width:430px;margin:0 auto;padding:10px;height:100%;display:flex;flex-direction:column;}
    .frame{border:4px solid #b0a898;border-radius:22px;overflow:hidden;flex:1;display:flex;flex-direction:column;background:#f8f8f6;min-height:0;}
    .scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;}
    input,textarea{-webkit-user-select:text;user-select:text;font-family:'DM Sans',sans-serif;}
    input[type="date"]::-webkit-calendar-picker-indicator{opacity:0.5;}
    .card{background:#fff;border-radius:14px;padding:16px;margin:10px 12px 0;border:1px solid #e8e3dc;}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;}
    .modal-box{
      background:#fff;
      border-radius:20px 20px 0 0;
      padding:24px 20px 32px;
      width:100%;
      max-width:430px;
      /* Výška: vejde se do rámečku — nav je ~60px, header ~90px */
      max-height:calc(100vh - 180px);
      overflow-y:auto;
      border-top:1px solid #e8e3dc;
      border-left:1px solid #e8e3dc;
      border-right:1px solid #e8e3dc;
    }
    .inp{width:100%;border:1.5px solid #e0dbd3;border-radius:10px;padding:11px 14px;font-size:15px;outline:none;background:#fafaf8;color:#1a1a1a;margin-top:4px;font-family:'DM Sans',sans-serif;}
    .inp:focus{border-color:#4a90d9;background:#fff;}
    .btn-next{width:100%;border:none;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px;color:#fff;}
    .btn-back{background:#f5f2ee;color:#555;border:1.5px solid #e0dbd3;border-radius:12px;padding:13px 0;font-size:15px;font-weight:600;cursor:pointer;flex:1;}
    .lbl{font-size:12px;color:#888;font-weight:500;margin-bottom:2px;display:block;margin-top:10px;}
    .hint{font-size:12px;color:#aaa;margin-bottom:14px;}
    .ttog{display:flex;background:#f0ede8;border-radius:10px;padding:3px;margin-bottom:14px;}
    .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px;}
    .cat-btn{border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
    .cat-lbl{font-size:9px;color:#555;font-weight:500;text-align:center;line-height:1.2;}
    .chip{border-radius:10px;padding:12px 6px;font-size:14px;cursor:pointer;flex:1;text-align:center;border:1.5px solid #e0dbd3;background:#fafaf8;color:#888;font-weight:500;}
    .chip.sel{font-weight:700;}
    .dot-row{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
    .sec{font-size:11px;font-weight:700;color:#aaa;margin:16px 12px 0;text-transform:uppercase;letter-spacing:1.2px;}
    .fr{display:flex;gap:8px;margin:10px 12px 0;}
    .fb{border-radius:10px;padding:8px;font-size:13px;cursor:pointer;text-align:center;flex:1;border:1.5px solid #e0dbd3;background:#fff;color:#888;font-weight:500;}
    .fb.active{border-color:#4a90d9;background:#eef5fd;color:#4a90d9;font-weight:700;}
    .txi{display:flex;align-items:center;gap:10px;padding:10px 0;}
    .tic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
    .nav{flex-shrink:0;background:#fff;border-top:1px solid #e8e3dc;display:flex;z-index:20;}
    .nb{flex:1;border:none;background:none;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:9px;font-weight:500;font-family:'DM Sans',sans-serif;color:#bbb;}
    .nb.active{color:#4a90d9;font-weight:700;}
    .fab{position:fixed;bottom:76px;right:calc(50% - 215px + 16px);width:52px;height:52px;border-radius:50%;background:#4a90d9;border:none;color:#fff;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(74,144,217,0.35);z-index:25;}
    textarea{resize:none;}
    .legend-item{display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:pointer;border-radius:8px;padding:4px 6px;border:1px solid transparent;}
    .icon-pick{display:flex;gap:12px;margin:14px 0 6px;justify-content:center;}
    .icon-opt{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #e0dbd3;background:#fafaf8;transition:all 0.15s;}
    .icon-opt.sel{border-color:#4a90d9;background:#eef5fd;}
    /* Skrytý input pro focus trick */
    .focus-hack{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
  </style>

const DAYS=["Ne","Po","Út","St","Čt","Pá","So"];
const STORAGE="wealthflow_v1";

function fmtMoney(n,cur,dec=false){
  const f=dec?2:0;
  if(cur==="EUR") return new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"EUR",maximumFractionDigits:f}).format(n);
  if(cur==="USD") return new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"USD",maximumFractionDigits:f}).format(n);
  return new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK",maximumFractionDigits:f}).format(n);
}
function fmtCZK(n){return fmtMoney(n,"CZK");}
function parseAmt(v){return parseFloat(String(v).replace(",","."))||0;}
function getCat(id){return ALL_CATS.find(c=>c.id===id)||{label:"Ostatní",icon:"📦",color:"#94A3B8"};}
function fmtDate(s){const d=new Date(s+"T00:00:00");return `${d.getDate()}. ${MONTHS[d.getMonth()]} ${d.getFullYear()} (${DAYS[d.getDay()]})`;}
function loadData(){try{const r=localStorage.getItem(STORAGE);if(r)return JSON.parse(r);}catch{}return null;}
function saveData(d){try{localStorage.setItem(STORAGE,JSON.stringify(d));}catch{}}

function exportData(){
  try{
    const d=localStorage.getItem(STORAGE)||"{}";
    const blob=new Blob([d],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="finance-zaloha.json";
    a.click();
    URL.revokeObjectURL(url);
  }catch(ex){alert("Export selhal: "+ex);}
}

function importData(jsonStr){
  try{
    const d=JSON.parse(jsonStr);
    localStorage.setItem(STORAGE,JSON.stringify(d));
    return true;
  }catch(ex){alert("Import selhal — soubor není platný.");return false;}
}

    e("path",{d:"M16 12h4v4h-4a2 2 0 0 1 0-4z"}),
    e("path",{d:"M8 7V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"})
  );
}
// Smaragdový diamant SVG
function EmeraldSVG({size=30}){

    e("polygon",{points:"16,3 28,11 16,29 4,11",fill:"#059669",opacity:"0.15"}),

    e("polygon",{points:"16,3 22,11 16,18 10,11",fill:"#10B981",opacity:"0.5"}),

// Kompas SVG
function CompassSVG({size=28,color="#4a90d9"}){

function BoltSVG({size=28,color="#F59E0B"}){
  return e("svg",{width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:color,strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},
    e("polygon",{points:"13 2 3 14 12 14 11 22 21 10 12 10 13 2",fill:color,opacity:"0.2",stroke:color})

// Štít SVG
function ShieldSVG({size=28,color="#8B5CF6"}){
  return e("svg",{width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:color,strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round"},

const ICONS=[
  {id:"wallet",label:"Peněženka"},
  {id:"emerald",label:"Smaragd"},
  {id:"compass",label:"Kompas"},
  {id:"bolt",label:"Blesk"},
  {id:"shield",label:"Štít"},
];
function renderIcon(id,size=28,color="#4a90d9"){
  if(id==="wallet") return e(WalletSVG,{size,color});
  if(id==="emerald") return e(EmeraldSVG,{size});
  if(id==="compass") return e(CompassSVG,{size,color});
  if(id==="bolt") return e(BoltSVG,{size,color:"#F59E0B"});
  if(id==="shield") return e(ShieldSVG,{size,color:"#8B5CF6"});
  return e(WalletSVG,{size,color});

// ── Klávesnice fix ─────────────────────────────────────────────────────────
// iOS Safari: focus() funguje POUZE pokud je voláno synchronně uvnitř
// user-gesture (touch/click). Triky s setTimeout nefungují spolehlivě.
// Řešení: input s autoFocus=true + onTouchStart který zavolá focus()
// přímo v handleru doteku — to iOS považuje za user gesture.
function AutoFocusInput({mode,placeholder,value,onChange}){
  const ref=useRef(null);

  // autoFocus pro Android/desktop
  useEffect(()=>{
    const el=ref.current;
    if(!el) return;
    // Pokus o focus — funguje na Androidu a desktopu okamžitě
    try{ el.focus(); }catch(ex){}
  },[]);

  function handleTouch(ev){
    // iOS: voláme focus() přímo v touch handleru = user gesture
    const el=ref.current;
    if(el) el.focus();
  }

  return inp({
    ref,
    className:"inp",
    type:"text",
    inputMode:mode,
    enterKeyHint:"done",
    autoFocus:true,
    autoComplete:"off",
    autoCorrect:mode==="text"?"on":"off",
    autoCapitalize:mode==="text"?"sentences":"none",
    spellCheck:mode==="text",
    placeholder,
    value,
    onTouchStart:handleTouch,
    onChange:ev=>onChange(ev.target.value),
  });
}

function PieChart({data,size=148,selected,onSelect}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total) return div({style:{textAlign:"center",color:"#ccc",padding:"20px",fontSize:"13px"}},"Žádné výdaje");
  const cx=size/2,cy=size/2,r=size/2-8;
  let angle=-Math.PI/2;
  const slices=data.map(d=>{
    const sweep=(d.value/total)*2*Math.PI;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=sweep;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const large=sweep>Math.PI?1:0;
    const mid=angle-sweep/2;
    const ox=Math.cos(mid)*5,oy=Math.sin(mid)*5;
    const sel=selected===d.id;
    return{...d,path:`M${cx+(sel?ox:0)},${cy+(sel?oy:0)} L${x1+(sel?ox:0)},${y1+(sel?oy:0)} A${r},${r} 0 ${large},1 ${x2+(sel?ox:0)},${y2+(sel?oy:0)} Z`,sel};
  });
  return e("svg",{width:size,height:size,viewBox:`0 0 ${size} ${size}`,style:{overflow:"visible"}},
    ...slices.map((s,i)=>e("path",{key:i,d:s.path,fill:s.color,stroke:s.sel?"#fff":"#f8f8f6",strokeWidth:s.sel?3:2,
      style:{cursor:"pointer",opacity:selected&&!s.sel?0.3:1,transition:"opacity 0.2s"},
      onClick:()=>onSelect(s.sel?null:s.id)})),
    e("circle",{cx,cy,r:r*0.42,fill:"#fff",style:{pointerEvents:"none"}}),
    e("text",{x:cx,y:cy-6,textAnchor:"middle",fontSize:9,fill:"#aaa",fontFamily:"DM Sans",style:{pointerEvents:"none"}},"Výdaje"),
    e("text",{x:cx,y:cy+9,textAnchor:"middle",fontSize:11,fill:"#1a1a1a",fontWeight:"700",fontFamily:"DM Sans",style:{pointerEvents:"none"}},fmtCZK(total))
  );
}

// ── ImportExport Modal ────────────────────────────────────────────────────────
function ImportExportModal({onClose,onImportDone}){
  const fileRef=useRef(null);
  const [copied,setCopied]=useState(false);
  const [importOk,setImportOk]=useState(false);

  function handleExport(){
    try{
      const d=localStorage.getItem(STORAGE)||"{}";
      const blob=new Blob([d],{type:"application/json"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url;
      a.download="finance-zaloha.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(ex){
      // Fallback — zkopíruj do schránky
      const d=localStorage.getItem(STORAGE)||"{}";
      navigator.clipboard&&navigator.clipboard.writeText(d).then(()=>{
        setCopied(true);
        setTimeout(()=>setCopied(false),2500);
      });
    }
  }

  function handleFileImport(ev){
    const file=ev.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=re=>{
      try{
        const d=JSON.parse(re.target.result);
        localStorage.setItem(STORAGE,JSON.stringify(d));
        setImportOk(true);
        setTimeout(()=>{onImportDone();onClose();},1200);
      }catch(ex){alert("Soubor není platný.");}
    };
    reader.readAsText(file);
  }

  const BD="#e8e3dc",TS="#888";
  return div({className:"modal-bg",onClick:ev=>{if(ev.target===ev.currentTarget)onClose();}},
    div({className:"modal-box"},
      div({style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
        e("h2",{style:{margin:0,fontSize:"18px",fontWeight:800,color:"#1a1a1a"}},"Záloha dat"),
        btn({onClick:onClose,style:{background:"#f5f2ee",border:"none",borderRadius:"50%",width:32,height:32,fontSize:"20px",cursor:"pointer",color:"#888",display:"flex",alignItems:"center",justifyContent:"center"}},"×")
      ),

      // EXPORT
      div({style:{background:"#f8fff8",border:"1px solid #c6e8c6",borderRadius:12,padding:"16px",marginBottom:12}},
        div({style:{fontSize:"14px",fontWeight:700,color:"#1a6e1a",marginBottom:6}},"📤 Export — záloha dat"),
        div({style:{fontSize:"13px",color:"#555",lineHeight:1.6,marginBottom:12}},"Stáhni zálohu svých dat jako soubor. Pak ho importuj v nové instalaci aplikace."),
        btn({onClick:handleExport,style:{width:"100%",background:"#22C55E",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:"15px",fontWeight:700,cursor:"pointer"}},
          copied?"✅ Zkopírováno do schránky":"📥 Stáhnout zálohu (JSON)"
        )
      ),

      // IMPORT
      div({style:{background:"#f8f8ff",border:"1px solid #c6c6e8",borderRadius:12,padding:"16px"}}),
      div({style:{background:"#f8f8ff",border:"1px solid #c6c6e8",borderRadius:12,padding:"16px"}},
        div({style:{fontSize:"14px",fontWeight:700,color:"#1a1a6e",marginBottom:6}},"📂 Import — obnovení dat"),
        div({style:{fontSize:"13px",color:"#555",lineHeight:1.6,marginBottom:12}},"Vyber soubor zálohy (finance-zaloha.json) který jsi předtím exportoval. Data se načtou okamžitě."),
        importOk
          ?div({style:{textAlign:"center",fontSize:"15px",fontWeight:700,color:"#22C55E",padding:"12px"}},"✅ Data úspěšně importována!")
          :btn({onClick:()=>fileRef.current&&fileRef.current.click(),style:{width:"100%",background:"#4a90d9",color:"#fff",border:"none",borderRadius:10,padding:"12px",fontSize:"15px",fontWeight:700,cursor:"pointer"}},"📂 Vybrat soubor zálohy"),
        e("input",{ref:fileRef,type:"file",accept:".json",style:{display:"none"},onChange:handleFileImport})
      ),

      // Návod
      div({style:{marginTop:14,padding:"12px",background:"#fafaf8",borderRadius:10,border:"1px solid #e8e3dc"}}),
      div({style:{marginTop:14,padding:"12px",background:"#fafaf8",borderRadius:10,border:"1px solid #e8e3dc"}},
        div({style:{fontSize:"12px",fontWeight:700,color:"#888",marginBottom:6}},"💡 POSTUP PŘI PŘESUNU DAT"),
        div({style:{fontSize:"12px",color:"#888",lineHeight:1.8}},
          "1. Otevři app v Safari prohlížeči",e("br",null),
          "2. Jdi do Nastavení → Export",e("br",null),
          "3. Stáhni soubor zálohy",e("br",null),
          "4. Otevři app z plochy (ikona)",e("br",null),
          "5. Jdi do Nastavení → Import",e("br",null),
          "6. Vyber stažený soubor → hotovo ✅"
        )
      )
    )

  const [nwStart,setNwStart]=useState(0);
  const [cfNotes,setCfNotes]=useState({});
  const [fixed,setFixed]=useState({necessary:[],investment:[],unnecessary:[]});
  const [house,setHouse]=useState([]);
  const [appIcon,setAppIcon]=useState("wallet");
  const [tab,setTab]=useState("transactions");
  const [month,setMonth]=useState(now.getMonth());
  const [year,setYear]=useState(now.getFullYear());
  const [txFilter,setTxFilter]=useState("all");
  const [showAdd,setShowAdd]=useState(false);
  const [showInvAdd,setShowInvAdd]=useState(false);
  const [showNW,setShowNW]=useState(false);
  const [showIconPick,setShowIconPick]=useState(false);
  const [showImportExport,setShowImportExport]=useState(false);
  const [editId,setEditId]=useState(null);
  const [selPie,setSelPie]=useState(null);
  const scrollRef=useRef(null);

  useEffect(()=>{
    const d=loadData();
    if(d){
      setTxs(d.transactions||[]);
      setInvs(d.investments||[]);
      setNwStart(d.netWorthStart||0);
      setCfNotes(d.cashflowNotes||{});
      const f=d.fixedExpenses||{necessary:[],investment:[],unnecessary:[]};
      if(!f.investment)f.investment=[];
      setFixed(f);
      setHouse(d.house||[]);
      if(d.appIcon)setAppIcon(d.appIcon);
    }
  },[]);
  useEffect(()=>{saveData({transactions:txs,investments:invs,netWorthStart:nwStart,cashflowNotes:cfNotes,fixedExpenses:fixed,house,appIcon});},[txs,invs,nwStart,cfNotes,fixed,house,appIcon]);

  function scrollTop(){if(scrollRef.current)scrollRef.current.scrollTop=0;}

  function reloadFromStorage(){
    const d=loadData();
    if(d){
      setTxs(d.transactions||[]);
      setInvs(d.investments||[]);
      setNwStart(d.netWorthStart||0);
      setCfNotes(d.cashflowNotes||{});
      const f=d.fixedExpenses||{necessary:[],investment:[],unnecessary:[]};
      if(!f.investment)f.investment=[];
      setFixed(f);
      setHouse(d.house||[]);
      if(d.appIcon)setAppIcon(d.appIcon);
    }
  }

  const fil=txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===month&&d.getFullYear()===year;});
  const totInc=fil.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const totExp=fil.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const cf=totInc-totExp;
  const allInc=txs.filter(t=>t.type==="income").reduce((s,t)=>s+t.amount,0);
  const allExp=txs.filter(t=>t.type==="expense").reduce((s,t)=>s+t.amount,0);
  const nw=nwStart+allInc-allExp;
  const invByCur=INV_CURR.reduce((a,c)=>{a[c]=invs.filter(i=>i.currency===c).reduce((s,i)=>s+i.amount*(i.qty||1),0);return a;},{});
  const expByCat=EXPENSE_CATS.reduce((a,c)=>{a[c.id]=fil.filter(t=>t.type==="expense"&&t.category===c.id).reduce((s,t)=>s+t.amount,0);return a;},{});
  const pieData=EXPENSE_CATS.filter(c=>expByCat[c.id]>0).sort((a,b)=>expByCat[b.id]-expByCat[a.id]).map(c=>({id:c.id,label:c.label,icon:c.icon,color:c.color,value:expByCat[c.id]}));
  const cfKey=`${year}-${month}`;
  const cfNote=cfNotes[cfKey]||"";
  const sumNec=fixed.necessary.reduce((s,r)=>s+parseAmt(r.amount),0);
  const sumInvF=fixed.investment.reduce((s,r)=>s+parseAmt(r.amount),0);
  const sumUnnec=fixed.unnecessary.reduce((s,r)=>s+parseAmt(r.amount),0);
  const sumHouse=house.reduce((s,r)=>s+parseAmt(r.amount),0);

  function saveTx(data){
    if(editId){setTxs(p=>p.map(t=>t.id===editId?{...t,...data}:t));setEditId(null);}
    else setTxs(p=>[{id:Date.now().toString(),...data},...p]);
    setShowAdd(false);setTimeout(scrollTop,100);
  }
  function saveInv(data){setInvs(p=>[{id:Date.now().toString(),...data},...p]);setShowInvAdd(false);setTimeout(scrollTop,100);}
  function prevMonth(){if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}
  function nextMonth(){if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}
  function addFixedRow(t){setFixed(p=>({...p,[t]:[...p[t],{id:Date.now().toString(),label:"",amount:""}]}));}
  function commitFixed(t,id,f,v){setFixed(p=>({...p,[t]:p[t].map(r=>r.id===id?{...r,[f]:v}:r)}));}
  function removeFixed(t,id){setFixed(p=>({...p,[t]:p[t].filter(r=>r.id!==id)}));}
  function addHouseRow(){setHouse(p=>[...p,{id:Date.now().toString(),label:"",amount:""}]);}
  function commitHouse(id,f,v){setHouse(p=>p.map(r=>r.id===id?{...r,[f]:v}:r));}
  function removeHouse(id){setHouse(p=>p.filter(r=>r.id!==id));}

  const visTxs=fil.filter(t=>txFilter==="all"||t.type===txFilter).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const byDay=visTxs.reduce((a,t)=>{if(!a[t.date])a[t.date]=[];a[t.date].push(t);return a;},{});
  const days=Object.keys(byDay).sort((a,b)=>new Date(b)-new Date(a));
  const BD="#e8e3dc",TS="#888",TH="#ccc";

  // Formát čísla s označením měny vedle
  const CUR_SYMBOL={CZK:"Kč",EUR:"€",USD:"$"};

  function renderTransactions(){
    return [
      div({key:"f",className:"fr"},
        btn({className:`fb${txFilter==="all"?" active":""}`,onClick:()=>setTxFilter("all")},"Vše"),
        btn({className:`fb${txFilter==="expense"?" active":""}`,onClick:()=>setTxFilter("expense")},"📤 Výdaje"),
        btn({className:`fb${txFilter==="income"?" active":""}`,onClick:()=>setTxFilter("income")},"📥 Příjmy")
      ),
      txFilter!=="all"&&div({key:"sum",className:"card",style:{textAlign:"center",padding:"12px 16px"}},
        div({style:{fontSize:"12px",color:TS,fontWeight:500}},txFilter==="expense"?"Výdaje tento měsíc":"Příjmy tento měsíc"),
        div({style:{fontSize:"26px",fontWeight:800,color:txFilter==="expense"?"#EF4444":"#22C55E",marginTop:4}},fmtCZK(txFilter==="expense"?totExp:totInc))
      ),
      div({key:"list",className:"card",style:{marginTop:10,padding:"0 14px"}},
        visTxs.length===0
          ?div({style:{textAlign:"center",color:TH,fontSize:"14px",padding:"24px"}},"Žádné záznamy.",e("br",null),"Přidej první pomocí +")
          :days.map((day,di)=>div({key:day},
              div({style:{display:"flex",alignItems:"center",gap:8,padding:"10px 0 4px",borderTop:di===0?"none":`1px solid ${BD}`,marginTop:di===0?0:4}},
                span({style:{fontSize:"11px",fontWeight:700,color:"#4a90d9",whiteSpace:"nowrap"}},fmtDate(day)),
                div({style:{flex:1,height:1,background:BD}})
              ),
              ...byDay[day].map((tx,ti)=>{
                const cat=getCat(tx.category);
                return div({key:tx.id,className:"txi",style:{borderBottom:ti<byDay[day].length-1?`1px solid ${BD}`:"none"}},
                  div({className:"tic",style:{background:cat.color+"22",border:`1.5px solid ${cat.color}44`}},span({style:{fontSize:"22px"}},cat.icon)),
                  div({style:{flex:1,minWidth:0}},
                    div({style:{fontSize:"14px",fontWeight:600,color:"#1a1a1a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},tx.note||cat.label),
                    div({style:{fontSize:"11px",color:TS}},cat.label)
                  ),
                  div({style:{textAlign:"right",flexShrink:0}},
                    div({style:{fontSize:"16px",fontWeight:800,color:tx.type==="income"?"#22C55E":"#EF4444"}},(tx.type==="income"?"+":"−")+fmtCZK(tx.amount)),
                    div({style:{display:"flex",gap:4,justifyContent:"flex-end",marginTop:2}},
                      btn({onClick:()=>{setEditId(tx.id);setShowAdd(true);},style:{background:"none",border:"none",cursor:"pointer",fontSize:"14px",color:TS}},"✏️"),
                      btn({onClick:()=>setTxs(p=>p.filter(t=>t.id!==tx.id)),style:{background:"none",border:"none",cursor:"pointer",fontSize:"14px",color:TH}},"🗑")
                    )
                  )
                );
              })
            ))
      )
    ].filter(Boolean);
  }

  function renderDashboard(){
    return [
      div({key:"nw",className:"card",style:{background:nw>=0?"linear-gradient(135deg,#1e3a6e,#4a90d9)":"linear-gradient(135deg,#6e1e1e,#d94a4a)",border:"none",cursor:"pointer"},onClick:()=>setShowNW(true)},
        div({style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          div(null,
            div({style:{fontSize:"11px",color:"rgba(255,255,255,0.7)",fontWeight:500,marginBottom:4}},"Čistý majetek"),
            div({style:{fontSize:"28px",fontWeight:800,color:"#fff"}},fmtCZK(nw)),
            div({style:{fontSize:"10px",color:"rgba(255,255,255,0.5)",marginTop:3}},`Startovní: ${fmtCZK(nwStart)} · Klepni pro úpravu`)
          ),
          div({style:{textAlign:"right"}},
            div({style:{fontSize:"10px",color:"rgba(255,255,255,0.6)"}},"Cash flow"),
            div({style:{fontSize:"20px",fontWeight:800,color:cf>=0?"#86efac":"#fca5a5",marginTop:2}},(cf>=0?"+":"")+fmtCZK(cf))
          )
        )
      ),
      div({key:"cfnote",className:"card",style:{padding:"12px 14px"}},
        div({style:{fontSize:"12px",color:TS,fontWeight:500,marginBottom:6}},"📝 Poznámka — "+MONTHS[month]),
        e("textarea",{className:"inp",style:{resize:"none",minHeight:"72px",lineHeight:1.5},placeholder:"Proč byl tento měsíc výkyv?",value:cfNote,inputMode:"text",onChange:ev=>setCfNotes(p=>({...p,[cfKey]:ev.target.value}))})
      ),
      div({key:"piesec",className:"sec"},"Výdaje dle kategorií"),
      div({key:"pie",className:"card"},
        pieData.length===0
          ?div({style:{textAlign:"center",color:TH,fontSize:"13px",padding:"16px"}},"Žádné výdaje tento měsíc")
          :div({style:{display:"flex",alignItems:"flex-start",gap:14}},
              div({style:{flexShrink:0}},e(PieChart,{data:pieData,size:148,selected:selPie,onSelect:setSelPie})),
              div({style:{flex:1,overflowY:"auto",maxHeight:170}},
                ...pieData.map((d,i)=>{
                  const tot=pieData.reduce((s,x)=>s+x.value,0);
                  const isSel=selPie===d.id,isDim=selPie&&!isSel;
                  return div({key:i,className:"legend-item",
                    style:{opacity:isDim?0.3:1,background:isSel?d.color+"15":"transparent",border:isSel?`1px solid ${d.color}50`:"1px solid transparent"},
                    onClick:()=>setSelPie(isSel?null:d.id)},
                    div({style:{width:11,height:11,borderRadius:"50%",background:d.color,flexShrink:0,boxShadow:isSel?`0 0 5px ${d.color}`:"none"}}),
                    span({style:{fontSize:"14px",color:"#1a1a1a",flex:1,fontWeight:isSel?700:500}},`${d.icon} ${d.label}`),
                    span({style:{fontSize:"14px",fontWeight:800,color:d.color}},Math.round((d.value/tot)*100)+"%")
                  );
                })
              )
            )
      ),
      div({key:"statsec",className:"sec"},"Tento měsíc"),
      div({key:"stat",className:"card",style:{display:"flex",gap:0,padding:0,overflow:"hidden"}},
        ...[{label:"Příjmy",val:totInc,color:"#22C55E"},{label:"Výdaje",val:totExp,color:"#EF4444"},{label:"Cash flow",val:cf,color:cf>=0?"#16A34A":"#DC2626"}].map((item,i)=>
          div({key:i,style:{flex:1,textAlign:"center",padding:"14px 4px",borderRight:i<2?`1px solid ${BD}`:"none"}},
            div({style:{fontSize:"11px",color:TS}},item.label),
            div({style:{fontSize:"15px",fontWeight:800,color:item.color,marginTop:3}},fmtCZK(item.val))
          )
        )
      )
    ];
  }

  function renderFixed(){
    return [
      e(FixedSection,{key:"nec",type:"necessary",title:"Nutné výdaje",color:"#8B5CF6",rows:fixed.necessary,onAdd:addFixedRow,onCommit:commitFixed,onRemove:removeFixed,sum:sumNec}),
      e(FixedSection,{key:"inv",type:"investment",title:"Investiční výdaje",color:"#4a90d9",rows:fixed.investment,onAdd:addFixedRow,onCommit:commitFixed,onRemove:removeFixed,sum:sumInvF}),
      e(FixedSection,{key:"unn",type:"unnecessary",title:"Zbytné výdaje",color:"#EC4899",rows:fixed.unnecessary,onAdd:addFixedRow,onCommit:commitFixed,onRemove:removeFixed,sum:sumUnnec}),
      div({key:"total",className:"card",style:{background:"linear-gradient(135deg,#1e3a6e,#4a90d9)",border:"none",marginBottom:12}},
        div({style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},
          div(null,
            div({style:{fontSize:"11px",color:"rgba(255,255,255,0.6)",marginBottom:3}},"Celkové pravidelné výdaje"),
            div({style:{fontSize:"26px",fontWeight:800,color:"#fff"}},fmtCZK(sumNec+sumInvF+sumUnnec))
          ),
          div({style:{textAlign:"right",fontSize:"12px",color:"rgba(255,255,255,0.8)",lineHeight:1.9}},
            div(null,"Nutné: ",e("b",null,fmtCZK(sumNec))),
            div(null,"Investice: ",e("b",null,fmtCZK(sumInvF))),
            div(null,"Zbytné: ",e("b",null,fmtCZK(sumUnnec)))
          )
        )
      )
    ];
  }

  function renderInvest(){
    return [
      div({key:"total",className:"card",style:{background:"linear-gradient(135deg,#2d1f5e,#6366F1)",border:"none"}},
        div({style:{fontSize:"12px",color:"rgba(255,255,255,0.6)",marginBottom:12}},"📈 Celkem zainvestováno"),
        // Měny vedle sebe: číslo + symbol měny
        div({style:{display:"flex",gap:0}},
          ...INV_CURR.map((c,i)=>{
            const val=invByCur[c];
            const sym=CUR_SYMBOL[c];
            const numStr=new Intl.NumberFormat("cs-CZ",{maximumFractionDigits:0}).format(val);
            return div({key:c,style:{flex:1,textAlign:"center",borderRight:i<2?"1px solid rgba(255,255,255,0.15)":"none",padding:"0 6px"}},
              div({style:{display:"flex",alignItems:"baseline",justifyContent:"center",gap:4}},
                span({style:{fontSize:"18px",fontWeight:800,color:"#fff"}},numStr),
                span({style:{fontSize:"13px",fontWeight:600,color:"rgba(255,255,255,0.6)"}},sym)
              )
            );
          })
        ),
        div({style:{fontSize:"11px",color:"rgba(255,255,255,0.4)",marginTop:10,textAlign:"center"}},invs.length+" pozic")
      ),
      div({key:"sec",className:"sec"},"Investiční portfolio"),
      div({key:"list",className:"card"},
        invs.length===0
          ?div({style:{textAlign:"center",color:TH,fontSize:"14px",padding:"20px"}},"Žádné investice.",e("br",null),"Přidej pomocí +")
          :[...invs].sort((a,b)=>(b.amount*b.qty)-(a.amount*a.qty)).map(inv=>div({key:inv.id,className:"txi"},
              div({className:"tic",style:{background:"rgba(99,102,241,0.12)",border:"1.5px solid rgba(99,102,241,0.2)",fontSize:"22px"}},"📈"),
              div({style:{flex:1,minWidth:0}},
                div({style:{fontSize:"14px",fontWeight:700,color:"#1a1a1a"}},inv.name),
                div({style:{fontSize:"11px",color:TS}},`${inv.type} · ${inv.qty>1?inv.qty+" ks · ":""}${new Date(inv.date).toLocaleDateString("cs-CZ")}`)
              ),
              div({style:{textAlign:"right",flexShrink:0}},
                div({style:{fontSize:"16px",fontWeight:800,color:"#6366F1"}},fmtMoney(inv.amount*inv.qty,inv.currency||"CZK",true)),
                div({style:{fontSize:"10px",color:TH}},inv.currency||"CZK"),
                btn({onClick:()=>setInvs(p=>p.filter(i=>i.id!==inv.id)),style:{background:"none",border:"none",cursor:"pointer",fontSize:"14px",color:TH}},"🗑")
              )
            ))
      )
    ];
  }

  function renderSettings(){
    return [
      div({key:"s1",className:"sec"},"Záloha a obnova dat"),
      div({key:"s2",className:"card"},
        div({style:{fontSize:"14px",color:"#555",lineHeight:1.7,marginBottom:12}},
          "Pokud sis přidal aplikaci na plochu, data se ukládají odděleně od Safari prohlížeče. Pomocí exportu/importu je přeneseš."
        ),
        btn({onClick:()=>setShowImportExport(true),style:{width:"100%",background:"#4a90d9",color:"#fff",border:"none",borderRadius:12,padding:"13px",fontSize:"16px",fontWeight:700,cursor:"pointer"}},"📦 Exportovat / Importovat data")
      ),
    ];
  }

  function renderHouse(){
    return [e(HouseSection,{key:"house",rows:house,onAdd:addHouseRow,onCommit:commitHouse,onRemove:removeHouse,sum:sumHouse})];
  }

  const NAV=[
    {id:"transactions",icon:"📋",label:"Záznamy"},
    {id:"dashboard",icon:"📊",label:"Přehled"},
    {id:"fixed",icon:"🔁",label:"Výdaje"},
    {id:"invest",icon:"📈",label:"Investice"},
    {id:"house",icon:"🇭🇷",label:"Domek"},
  ];

  return div({style:{display:"flex",flexDirection:"column",height:"100%",minHeight:0}},
    // HEADER
    div({style:{background:"#fff",padding:"12px 16px 10px",borderBottom:"1px solid #e8e3dc",flexShrink:0}},
      // Řádek: ikona + název + mezera + ⚙️
      div({style:{display:"flex",alignItems:"center",gap:10}},
        btn({onClick:()=>setShowIconPick(true),style:{background:"#eef5fd",border:"1.5px solid #c8ddf5",borderRadius:10,width:38,height:38,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,padding:0}},
          renderIcon(appIcon,22,"#4a90d9")
        ),
        e("h1",{style:{fontSize:"16px",fontWeight:800,color:"#1a1a1a",margin:0,whiteSpace:"nowrap",flex:1}},"Správa účtu a investic"),
        btn({onClick:()=>setShowImportExport(true),style:{background:"none",border:"none",cursor:"pointer",fontSize:"22px",padding:"4px",color:"#aaa",flexShrink:0}},
          "⚙️"
        )
      ),
      div({style:{display:"flex",alignItems:"center",gap:8,marginTop:10}},
        btn({style:{background:"#f5f2ee",border:"1px solid #e0dbd3",cursor:"pointer",fontSize:"18px",color:"#888",padding:"3px 14px",borderRadius:8},onClick:prevMonth},"‹"),
        span({style:{fontSize:"18px",fontWeight:800,color:"#1a1a1a",minWidth:130,textAlign:"center"}},MONTHS[month]+" "+year),
        btn({style:{background:"#f5f2ee",border:"1px solid #e0dbd3",cursor:"pointer",fontSize:"18px",color:"#888",padding:"3px 14px",borderRadius:8},onClick:nextMonth},"›")
      )
    ),
    div({ref:scrollRef,className:"scroll-area"},
      ...(tab==="transactions"?renderTransactions():tab==="dashboard"?renderDashboard():tab==="fixed"?renderFixed():tab==="invest"?renderInvest():tab==="house"?renderHouse():renderSettings())
    ),
    e("nav",{className:"nav"},
      ...NAV.map(n=>btn({key:n.id,className:`nb${tab===n.id?" active":""}`,onClick:()=>setTab(n.id)},
        span({style:{fontSize:"20px"}},n.icon),n.label
      ))
    ),
    (tab==="transactions"||tab==="invest")&&btn({className:"fab",onClick:()=>tab==="invest"?setShowInvAdd(true):setShowAdd(true)},"+"),
    showAdd&&e(AddTxWizard,{now,editTx:editId?txs.find(t=>t.id===editId):null,onClose:()=>{setShowAdd(false);setEditId(null);},onSave:saveTx}),
    showInvAdd&&e(AddInvWizard,{now,onClose:()=>setShowInvAdd(false),onSave:saveInv}),
    showNW&&e(NWModal,{onClose:()=>setShowNW(false),onSave:v=>{setNwStart(v);setShowNW(false);}}),
    showIconPick&&e(IconPickerModal,{current:appIcon,onSelect:setAppIcon,onClose:()=>setShowIconPick(false)}),
    showImportExport&&e(ImportExportModal,{onClose:()=>setShowImportExport(false),onImportDone:reloadFromStorage})
  );
}

ReactDOM.createRoot(document.getElementById('app-frame')).render(e(App,null));
</script>
</body>
</html>
