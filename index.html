<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#F4EFE6"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Správa účtu"/>
  <title>Správa účtu a investic</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* Vzhled D – krémová, tmavě zelená, zlatá. Barvy jsou tokeny, tmavý režim je jen přepíše. */
    :root{
      --bg:#F4EFE6;--card:#FFFDF8;--card2:#EFE8DA;--line:#E6DECF;
      --fg:#1F2A24;--muted:#7A7466;--faint:#A39C8C;
      --brand:#1F3B2D;--brand-fg:#F4EFE6;--brand-sub:#B9C9B8;
      --gold:#9C7A2E;--gold-hi:#D4B26A;
      --pos:#3F8A4F;--neg:#B4442F;
      --sel-bg:#1F3B2D;--sel-fg:#F4EFE6;
      --overlay:rgba(24,28,24,.42);
      --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      color-scheme:light;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#111512;--card:#1A201C;--card2:#242C26;--line:#2C352F;
        --fg:#ECE6D8;--muted:#A19A8C;--faint:#6F6A60;
        --brand:#22402F;--brand-fg:#F1EBDD;--brand-sub:#A9BDA9;
        --gold:#D4B26A;--gold-hi:#E2C584;
        --pos:#72C083;--neg:#E5826B;
        --sel-bg:#D4B26A;--sel-fg:#111512;
        --overlay:rgba(0,0,0,.62);
        color-scheme:dark;
      }
    }
    :root[data-theme="dark"]{
      --bg:#111512;--card:#1A201C;--card2:#242C26;--line:#2C352F;
      --fg:#ECE6D8;--muted:#A19A8C;--faint:#6F6A60;
      --brand:#22402F;--brand-fg:#F1EBDD;--brand-sub:#A9BDA9;
      --gold:#D4B26A;--gold-hi:#E2C584;
      --pos:#72C083;--neg:#E5826B;
      --sel-bg:#D4B26A;--sel-fg:#111512;
      --overlay:rgba(0,0,0,.62);
      color-scheme:dark;
    }
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--fg);}
    body{font-family:var(--font);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
    button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
    input,textarea,select{font-family:inherit;color:var(--fg);-webkit-user-select:text;user-select:text;}
    button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;}
    .num{font-variant-numeric:tabular-nums;}
    #app-frame{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:0;}

    .top{flex-shrink:0;padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:8px;}
    .top h1{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;}
    .mswitch{display:flex;align-items:center;gap:2px;flex:1;}
    .mswitch .mname{font-size:20px;font-weight:700;letter-spacing:-.02em;min-width:0;padding:0 4px;}
    .icon-btn{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
    .icon-btn:active{background:var(--card2);}
    .demo{margin:0 16px 6px;padding:6px 12px;border-radius:10px;background:var(--card2);color:var(--muted);font-size:12px;text-align:center;}

    .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px max(16px,env(safe-area-inset-right,0px)) 110px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;}
    .scroll>*{flex-shrink:0;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;}
    .card.flush{padding:4px 16px;}
    .sec{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px -4px;}
    .sec h3{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;}
    .sec button{font-size:13px;font-weight:600;color:var(--gold);}
    .muted{color:var(--muted);}.faint{color:var(--faint);}
    .pos{color:var(--pos);}.neg{color:var(--neg);}

    .hero{background:var(--brand);color:var(--brand-fg);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:4px;border:none;text-align:left;width:100%;}
    .hero .lbl{color:var(--brand-sub);font-size:13px;}
    .hero .big{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;}
    .hero .gold{color:var(--gold-hi);font-size:13px;font-weight:600;}
    .hero .split{display:flex;gap:16px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:var(--brand-sub);flex-wrap:wrap;}
    .hero .split b{display:block;color:var(--brand-fg);font-size:15px;font-weight:600;}

    .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;}
    .tile .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;}
    .tile .v{font-size:19px;font-weight:700;letter-spacing:-.02em;}
    .tile .s{font-size:11px;color:var(--faint);}

    .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    .qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg);}
    .qa .qi{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);color:var(--brand);}
    :root[data-theme="dark"] .qa .qi{color:var(--gold-hi);}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .qa .qi{color:var(--gold-hi);}}

    .cic{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex-shrink:0;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);}
    :root[data-theme="dark"] .cic{color:color-mix(in srgb,var(--c) 60%,#fff);background:color-mix(in srgb,var(--c) 26%,transparent);}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cic{color:color-mix(in srgb,var(--c) 60%,#fff);background:color-mix(in srgb,var(--c) 26%,transparent);}}

    .row{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%;text-align:left;}
    .row+.row{border-top:1px solid var(--line);}
    .row .main{flex:1;min-width:0;}
    .row .ttl{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .row .sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .row .amt{font-size:15px;font-weight:700;text-align:right;flex-shrink:0;}
    .row .amt small{display:block;font-size:11px;font-weight:500;color:var(--muted);}
    .row .amt small.pos{color:var(--pos);font-weight:600;} .row .amt small.neg{color:var(--neg);font-weight:600;}
    .totals{margin-left:auto;text-align:right;font-size:16px;font-weight:700;line-height:1.2;}
    .fold{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:15px;font-weight:600;padding:12px 0;}
    .fold .main{flex:1;}
    .day{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);margin:8px 4px -6px;}

    .bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:6px;}
    .bar i{display:block;height:100%;border-radius:3px;background:var(--c);}

    .chips{display:flex;gap:6px;flex-wrap:wrap;}
    .chip{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--muted);}
    .chip.on{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg);}
    .seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px;}
    .seg button{flex:1;padding:9px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);}
    .seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);}
    .seg.exp button.on.e{color:var(--neg);} .seg.exp button.on.i{color:var(--pos);}

    .search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--faint);}
    .search input{flex:1;border:none;background:none;outline:none;padding:11px 0;font-size:16px;min-width:0;}

    .plus{flex:0 0 auto;width:56px;height:56px;margin:-22px 6px 0;border-radius:50%;background:var(--brand);color:var(--gold-hi);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(31,59,45,.32);border:4px solid var(--bg);}
    .sum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 2px 0;}
    .sum-head .lbl2{font-size:13px;color:var(--muted);}
    .sum-head .big2{font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1.1;}
    .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;}
    .stack i{display:block;min-width:3px;}
    .ctiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .ctile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;}
    .ctile .ch{display:flex;align-items:center;gap:8px;min-width:0;margin-bottom:4px;}
    .ctile .cl{font-size:13px;font-weight:600;color:var(--muted);line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0;}
    .ctile .cv{font-size:19px;font-weight:700;letter-spacing:-.02em;}
    .ctile .cd{font-size:12px;font-weight:600;color:var(--faint);}
    .ctile .cd.pos{color:var(--pos);} .ctile .cd.neg{color:var(--neg);}
    .linkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;}
    .linkrow .main{flex:1;min-width:0;font-size:15px;font-weight:600;}
    .linkrow .main span{display:block;font-size:12px;font-weight:500;color:var(--muted);}
    .nav{position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px));}
    .nav-in{max-width:520px;margin:0 auto;display:flex;align-items:center;}
    .nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;font-size:11px;font-weight:600;color:var(--faint);}
    .nb.on{color:var(--brand);}
    :root[data-theme="dark"] .nb.on{color:var(--gold-hi);}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nb.on{color:var(--gold-hi);}}

    .sheet-bg{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease;}
    .sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease;}
    .sheet-hd{display:flex;align-items:center;gap:8px;padding:14px 12px 6px 20px;position:relative;}
    .sheet-hd h2{flex:1;font-size:18px;font-weight:700;}
    .grab{position:absolute;top:6px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line);}
    .sheet-body{overflow-y:auto;padding:6px 20px 16px;display:flex;flex-direction:column;gap:14px;}
    .sheet-ft{padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 14px);border-top:1px solid var(--line);display:flex;gap:10px;}
    @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){.sheet,.sheet-bg{animation:none;}}

    .btn{flex:1;padding:14px;border-radius:14px;font-size:16px;font-weight:700;background:var(--brand);color:var(--brand-fg);}
    .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--fg);flex:0 0 auto;padding:14px 18px;}
    .btn.danger{background:var(--neg);color:#fff;}
    .btn.small{flex:0 0 auto;padding:9px 14px;font-size:14px;border-radius:11px;}
    .link-danger{color:var(--neg);font-weight:600;font-size:14px;padding:8px 0;}

    .lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block;letter-spacing:.02em;}
    .inp{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;outline:none;background:var(--card);}
    .inp:focus{border-color:var(--gold-hi);}
    .amount-box{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 0 2px;}
    .amount-box input{width:100%;max-width:260px;text-align:center;border:none;background:none;outline:none;font-size:44px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
    .amount-box span{font-size:22px;font-weight:600;color:var(--muted);}
    .err{color:var(--neg);font-size:13px;text-align:center;}
    .catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
    .catbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:14px;border:1.5px solid transparent;font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.2;}
    .catbtn.on{border-color:var(--c);background:var(--card);color:var(--fg);}
    .toggle{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%;}
    .toggle .main{flex:1;min-width:0;}
    .toggle .main b{display:block;font-size:15px;font-weight:600;}
    .toggle .main span{font-size:12px;color:var(--muted);}
    .sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex-shrink:0;transition:background .15s;}
    .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s;}
    .sw.on{background:var(--pos);} .sw.on::after{transform:translateX(18px);}
    .inv-box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .swatches{display:flex;flex-wrap:wrap;gap:8px;}
    .swatch{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;}
    .swatch.on{border-color:var(--fg);}
    .icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
    .iconopt{aspect-ratio:1;max-width:100%;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1.5px solid transparent;color:var(--muted);}
    .iconopt.on{border-color:var(--c);color:var(--c);background:var(--card);}
    .note{width:100%;min-height:76px;resize:none;line-height:1.5;}
    .confirm{background:color-mix(in srgb,var(--neg) 10%,var(--card));border:1px solid color-mix(in srgb,var(--neg) 35%,var(--line));border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 150px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;}
    .empty{text-align:center;color:var(--muted);padding:22px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
    .donut-wrap{display:flex;justify-content:center;padding:4px 0 8px;}
    .donut-l{font-size:11px;fill:var(--muted);font-family:var(--font);}
    .donut-v{font-size:16px;font-weight:700;fill:var(--fg);font-family:var(--font);}
    .chart-t{font-size:10px;fill:var(--faint);font-family:var(--font);}
    .delta{font-size:11px;font-weight:600;}
    .setrow{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left;font-size:15px;}
    .setrow+.setrow{border-top:1px solid var(--line);}
    .setrow .main{flex:1;min-width:0;}
    .badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--muted);}
    .fixrow{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
    .fixrow input{border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;background:var(--bg);outline:none;min-width:0;}
    .fixrow input:focus{border-color:var(--gold-hi);}
    .add-dashed{width:100%;border:1.5px dashed var(--line);border-radius:12px;padding:10px;font-size:14px;font-weight:600;color:var(--muted);}
    .cur-in{flex:1;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);min-width:0;}
    .cur-in span{padding:9px 10px;font-size:13px;font-weight:700;color:var(--muted);border-right:1px solid var(--line);}
    .cur-in input{flex:1;border:none;outline:none;background:none;padding:9px 10px;font-size:15px;text-align:right;min-width:0;font-variant-numeric:tabular-nums;}

function pad(n){return String(n).padStart(2,"0");}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayISO(){return isoDate(new Date());}
function parseISO(s){const [y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1);}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}
function ym(y,m){return y+"-"+pad(m+1);}
function addMonths(key,n){let [y,m]=key.split("-").map(Number);m=m-1+n;y+=Math.floor(m/12);m=((m%12)+12)%12;return y+"-"+pad(m+1);}
function dayLabel(s){
  const t=todayISO();
  if(s===t)return "Dnes";
  if(s===isoDate(new Date(Date.now()-864e5)))return "Včera";
  const d=parseISO(s);
  return DAYS[d.getDay()].replace(/^./,c=>c.toUpperCase())+" "+d.getDate()+". "+MONTHS_GEN[d.getMonth()];
}
function fmtMoney(n,cur){
  const v=Math.round((Number(n)||0)*100)/100;
  const dec=Math.round(v)!==v?2:0;
  return new Intl.NumberFormat("cs-CZ",{style:"currency",currency:cur||"CZK",minimumFractionDigits:dec,maximumFractionDigits:dec}).format(v);
}
function fmtCZK(n){return fmtMoney(n,"CZK");}
function fmtSigned(n){return (n>0?"+":n<0?"−":"")+fmtCZK(Math.abs(n));}
function fmtCompact(n){return new Intl.NumberFormat("cs-CZ",{notation:"compact",maximumFractionDigits:1}).format(n);}
function parseAmt(v){return parseFloat(String(v??"").replace(/\s/g,"").replace(",","."))||0;}

function normalize(raw){
  const d={...(raw||{})};
  d.transactions=Array.isArray(d.transactions)?d.transactions:[];
  d.investments=Array.isArray(d.investments)?d.investments:[];
  // Pozice z XTB: nákupní cena v Kč podle kurzu ze dne každého nákupu (doplní se jednou).
  d.investments=d.investments.map(i=>i.costCZK==null&&XTB_COST_CZK[i.id]!=null?{...i,costCZK:XTB_COST_CZK[i.id]}:i);
  // Vonovia z výpisu XTB nepatří uživateli – odebere se (jen tato pozice převzatá z XTB).
  d.investments=d.investments.filter(i=>i.id!=="xtb-vna");
  d.netWorthStart=Number(d.netWorthStart)||0;
  d.cashflowNotes=d.cashflowNotes&&typeof d.cashflowNotes==="object"?d.cashflowNotes:{};
  const f=d.fixedExpenses||{};
  d.fixedExpenses={...f,necessary:f.necessary||[],investment:f.investment||[],unnecessary:f.unnecessary||[]};
  d.house=(d.house||[]).map(r=>({...r,amountCZK:r.amountCZK!==undefined?r.amountCZK:(r.amount||""),amountEUR:r.amountEUR||""}));
  d.appIcon=d.appIcon||"wallet";
  d.recurring=Array.isArray(d.recurring)?d.recurring:[];
  const c=d.categories||{};
  d.categories={overrides:c.overrides||{},custom:c.custom||[]};
  const s=d.settings||{};
  d.settings={...s,theme:s.theme||"auto",rates:{EUR:25,USD:23,...(s.rates||{})}};
  d.v=2;
  return d;
}

// Platba v kategorii Investice se zapíše i do investic (pokud to uživatel nechá zapnuté).
function makeTx(t,invInfo,invs){
  const tx={id:newId(),created:Date.now(),...t};
  if(t.type==="expense"&&t.category==="investments"&&invInfo&&invInfo.enabled){
    const inv={id:newId(),name:invInfo.name||t.note||"Investice",amount:t.amount,qty:1,type:invInfo.type||"ETF",currency:"CZK",date:t.date,txId:tx.id};
    // Další nákup stejné investice sleduje stejný fond jako ty předchozí (pokud byl zvolen ručně).
    const same=invs.find(x=>x.name===inv.name&&x.market);
    if(same)inv.market=same.market;
    tx.invId=inv.id;
    invs=[inv,...invs];
  }
  return {tx,invs};
}

// Zapíše pravidelné platby, jejichž den už v daném měsíci nastal.
function applyRecurring(d){
  const today=todayISO(),cur=today.slice(0,7);
  let txs=d.transactions,invs=d.investments,changed=false;
  const rules=d.recurring.map(r=>{
    if(!r.active)return r;
    let m=r.lastMonth?addMonths(r.lastMonth,1):r.startMonth,last=r.lastMonth,guard=0;
    while(m<=cur&&guard++<120){
      const [y,mo]=m.split("-").map(Number);
      const date=m+"-"+pad(Math.min(r.day,daysIn(y,mo-1)));
      if(date>today)break;
      const res=makeTx({type:r.type,date,category:r.category,amount:r.amount,note:r.note,recurringId:r.id,regular:true},r.inv,invs);
      txs=[res.tx,...txs];invs=res.invs;last=m;changed=true;
      m=addMonths(m,1);
    }
    return last!==r.lastMonth?{...r,lastMonth:last}:r;
  });
  return changed?{...d,transactions:txs,investments:invs,recurring:rules}:d;
}

function upcoming(rules,days){
  const now=new Date(),t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()),out=[];
  rules.filter(r=>r.active).forEach(r=>{
    for(let k=0;k<2;k++){
      const y=t0.getFullYear(),m=t0.getMonth()+k;
      const d=new Date(y,m,Math.min(r.day,daysIn(y,m)));
      const diff=Math.round((d-t0)/864e5);
      if(diff>0&&diff<=days){out.push({rule:r,date:isoDate(d),diff});break;}
    }
  });
  return out.sort((a,b)=>a.diff-b.diff);
}

// ── Zadání platby (jedna obrazovka) ─────────────────────────────────────────
function TxSheet({data,editTx,preset,onSave,onDelete,onClose}){
  const cfg=data.categories;
  const [type,setType]=useState(editTx?editTx.type:(preset&&preset.type)||"expense");
  const [amount,setAmount]=useState(editTx?String(editTx.amount).replace(".",","):"");
  const [cat,setCat]=useState(editTx?editTx.category:(preset&&preset.category)||(type==="income"?"salary":"food"));
  const [date,setDate]=useState(editTx?editTx.date:todayISO());
  const [note,setNote]=useState(editTx?(editTx.note||""):"");
  const [regular,setRegular]=useState(editTx?!!(editTx.regular||editTx.recurringId):cat==="salary");
  const [invOn,setInvOn]=useState(true);
  const [invName,setInvName]=useState("");
  const [invType,setInvType]=useState("ETF");
  const [err,setErr]=useState("");
  const [confirmDel,setConfirmDel]=useState(false);
  const [delInv,setDelInv]=useState(true);
  const amtRef=useRef(null);
  useEffect(()=>{if(!editTx&&amtRef.current){try{amtRef.current.focus();}catch{}}},[]);

  let cats=catList(type,cfg,false);
  if(!cats.find(c=>c.id===cat)&&editTx&&editTx.category===cat)cats=[...cats,catById(cat,cfg)];
  const linkedInv=editTx&&editTx.invId?data.investments.find(i=>i.id===editTx.invId):null;
  const isInv=type==="expense"&&cat==="investments";

  function switchType(t){
    setType(t);
    const list=catList(t,cfg,false);
    if(!list.find(c=>c.id===cat)){const nc=t==="income"?"salary":"food";setCat(list.find(c=>c.id===nc)?nc:(list[0]||{}).id);}
    if(!editTx)setRegular(t==="income"&&cat==="salary");
  }
  // Výběr kategorie zavře číselník, aby byla vidět celá nabídka.
  function pickCat(id){
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    setCat(id);if(!editTx&&type==="income")setRegular(id==="salary");
  }
  // Nápověda „Za co?“ z dřívějších zápisů: při psaní hledá ve všech, jinak ukáže nejčastější v kategorii.
  const q=note.trim().toLowerCase();
  const seen={};
  data.transactions.forEach(t=>{
    const n=(t.note||"").trim();if(!n)return;
    const k=n.toLowerCase();
    const s=seen[k]||(seen[k]={text:n,count:0,cat:0});
    s.count++;if(t.category===cat&&t.type===type)s.cat++;
  });
  const suggestions=Object.values(seen)
    .filter(s=>q?s.text.toLowerCase().includes(q)&&s.text.toLowerCase()!==q:s.cat>0)
    .sort((a,b)=>q?(b.count-a.count):(b.cat-a.cat))
    .slice(0,6);
  function save(){
    const a=parseAmt(amount);
    if(a<=0){setErr("Zadej částku větší než 0.");return;}
    if(!cat){setErr("Vyber kategorii.");return;}
    const t={type,amount:a,category:cat,date,note:note.trim()};
    if(type==="income")t.regular=regular;
    onSave(t,{inv:{enabled:isInv&&invOn,name:invName.trim(),type:invType}});
  }

  const footer=[
    editTx&&e("button",{key:"d",className:"btn ghost","aria-label":"Smazat záznam",onClick:()=>setConfirmDel(true)},e(Icon,{n:"trash",size:20})),
    e("button",{key:"s",className:"btn",onClick:save},editTx?"Uložit změny":"Přidat "+(type==="income"?"příjem":"výdaj")),
  ];
  return e(Sheet,{title:editTx?"Upravit záznam":"Nový záznam",onClose,footer},
    e(Seg,{cls:"exp",value:type,onChange:switchType,options:[{v:"expense",l:"Výdaj",c:"e"},{v:"income",l:"Příjem",c:"i"}]}),
    e("div",null,
      e("div",{className:"amount-box"},
        e("input",{ref:amtRef,id:"tx-amount",type:"text",inputMode:"decimal",enterKeyHint:"done",autoComplete:"off",placeholder:"0",value:amount,"aria-label":"Částka v Kč",
          style:{width:Math.max(1,amount.length)+0.6+"ch"},
          onChange:ev=>{setAmount(ev.target.value);setErr("");},onTouchStart:ev=>ev.currentTarget.focus()}),
        e("span",null,"Kč")),
      err&&e("div",{className:"err"},err)),
    e(Field,{label:"Kategorie"},e(CatGrid,{cats,value:cat,onChange:pickCat})),
    isInv&&!editTx&&e("div",{className:"inv-box"},
      e(Toggle,{on:invOn,onChange:setInvOn,title:"Zapsat i do investic",sub:"Výdaj se započítá do měsíce a zároveň se přidá do Majetku."}),
      invOn&&e(Field,{label:"Název investice"},e("input",{className:"inp",id:"tx-inv-name",placeholder:note||"Např. ETF S&P 500",value:invName,onChange:ev=>setInvName(ev.target.value)})),
      invOn&&e("div",{className:"chips"},...INV_TYPES.map(t=>e("button",{key:t,className:"chip"+(invType===t?" on":""),onClick:()=>setInvType(t)},t)))),
    linkedInv&&e("div",{className:"inv-box"},
      e("div",{style:{display:"flex",gap:10,alignItems:"center"}},e(Icon,{n:"chart-line-up",size:20}),
        e("div",{style:{fontSize:14}},"Propojeno s investicí ",e("b",null,linkedInv.name),". Změna částky a data se promítne i tam."))),
    e(Field,{label:"Datum"},e(DateField,{value:date,onChange:setDate})),
    e(Field,{label:"Za co? (nepovinné)"},
      e("input",{className:"inp",id:"tx-note",type:"text",autoComplete:"off",autoCapitalize:"sentences",enterKeyHint:"done",value:note,onChange:ev=>setNote(ev.target.value)}),
      suggestions.length>0&&e("div",{className:"chips",style:{marginTop:8}},
        ...suggestions.map(s=>e("button",{key:s.text,className:"chip",onClick:()=>setNote(s.text)},s.text)))),
    type==="income"&&e(Toggle,{on:regular,onChange:setRegular,title:"Pravidelný příjem",sub:"Mzda, nájem od podnájemníka… Nepravidelné jsou faktury, prodeje."}),
    editTx&&editTx.recurringId&&e("div",{className:"muted",style:{fontSize:13,display:"flex",gap:6,alignItems:"center"}},e(Icon,{n:"arrows-clockwise",size:16}),"Zapsáno automaticky z pravidelné platby."),
    confirmDel&&e("div",{className:"confirm"},
      e("b",null,"Smazat tento záznam?"),
      linkedInv&&e(Toggle,{on:delInv,onChange:setDelInv,title:"Smazat i investici",sub:linkedInv.name}),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{className:"btn small ghost",onClick:()=>setConfirmDel(false)},"Ponechat"),
        e("button",{className:"btn small danger",onClick:()=>onDelete(editTx,linkedInv&&delInv)},"Smazat")))
  );
}

// ── Investice ───────────────────────────────────────────────────────────────
function InvSheet({inv,onSave,onDelete,onClose}){
  const [name,setName]=useState(inv?inv.name:"");
  const [type,setType]=useState(inv?inv.type:"ETF");
  const [cur,setCur]=useState(inv?(inv.currency||"CZK"):"CZK");
  const [qty,setQty]=useState(inv?String(inv.qty||1).replace(".",","):"1");
  const [price,setPrice]=useState(inv?String(inv.amount).replace(".",","):"");
  const [date,setDate]=useState(inv?inv.date:todayISO());
  const [val,setVal]=useState(inv&&inv.curValue!=null?String(inv.curValue).replace(".",","):"");
  const [market,setMarket]=useState(inv&&inv.market&&(inv.market==="none"||MARKETS.some(m=>m.id===inv.market))?inv.market:"");
  const [err,setErr]=useState("");
  const [confirmDel,setConfirmDel]=useState(false);
  const cost=parseAmt(price)*(parseAmt(qty)||1);
  const v=val===""?null:parseAmt(val);
  const pl=v==null?null:v-cost;
  const types=INV_TYPES.includes(type)?INV_TYPES:[...INV_TYPES,type];
  function save(){
    if(!name.trim()){setErr("Zadej název investice.");return;}
    if(parseAmt(price)<=0){setErr("Zadej nákupní cenu.");return;}
    // Fond se ukládá jen tehdy, když se liší od toho, co se pozná z názvu.
    const effMkt=market||mktAuto(name)||"none";
    const out={name:name.trim(),type,currency:cur,qty:parseAmt(qty)||1,amount:parseAmt(price),date,market:effMkt===(mktAuto(name)||"none")?undefined:effMkt};
    if(v!=null){out.curValue=v;out.curDate=(inv&&inv.curValue===v)?inv.curDate:todayISO();}
    else{out.curValue=undefined;out.curDate=undefined;}
    onSave(out);
  }
  return e(Sheet,{title:inv?"Upravit investici":"Nová investice",onClose,footer:[
      inv&&e("button",{key:"d",className:"btn ghost","aria-label":"Smazat investici",onClick:()=>setConfirmDel(true)},e(Icon,{n:"trash",size:20})),
      e("button",{key:"s",className:"btn",onClick:save},inv?"Uložit":"Přidat investici")]},
    e(Field,{label:"Název"},e("input",{className:"inp",id:"inv-name",value:name,placeholder:"Např. Vanguard S&P 500",onChange:ev=>{setName(ev.target.value);setErr("");}})),
    e(Field,{label:"Typ"},e("div",{className:"chips"},...types.map(t=>e("button",{key:t,className:"chip"+(type===t?" on":""),onClick:()=>setType(t)},t)))),
    e(Field,{label:"Měna"},e("div",{className:"chips"},...INV_CURR.map(c=>e("button",{key:c,className:"chip"+(cur===c?" on":""),onClick:()=>setCur(c)},c)))),
    e("div",{className:"two"},
      e(Field,{label:"Počet kusů"},e("input",{className:"inp num",id:"inv-qty",inputMode:"decimal",value:qty,onChange:ev=>setQty(ev.target.value)})),
      e(Field,{label:"Cena za kus ("+cur+")"},e("input",{className:"inp num",id:"inv-price",inputMode:"decimal",placeholder:"0",value:price,onChange:ev=>{setPrice(ev.target.value);setErr("");}}))),
    e("div",{className:"muted",style:{fontSize:13}},"Nákup celkem: ",e("b",{className:"num"},fmtMoney(cost,cur))),
    e(Field,{label:"Datum nákupu"},e(DateField,{value:date,onChange:setDate})),
    e(Field,{label:"Současná hodnota celkem ("+cur+")"},e("input",{className:"inp num",id:"inv-value",inputMode:"decimal",placeholder:"Nevyplněno = nákupní cena",value:val,onChange:ev=>setVal(ev.target.value)})),
    pl!=null&&cost>0&&e("div",{className:pl>=0?"pos":"neg",style:{fontSize:14,fontWeight:700}},
      (pl>=0?"Zisk ":"Ztráta ")+fmtMoney(Math.abs(pl),cur)+" ("+(pl>=0?"+":"−")+Math.abs(pl/cost*100).toFixed(1).replace(".",",")+" %)"),
    (()=>{
      // Nový záznam: dokud uživatel nevybere, platí fond poznaný z rozepsaného názvu.
      const eff=market||mktAuto(name)||"none";
      return e(Field,{label:"Sleduje fond"},e("div",{className:"chips"},
        ...MARKETS.map(m=>e("button",{key:m.id,className:"chip"+(eff===m.id?" on":""),onClick:()=>setMarket(m.id)},m.label)),
        e("button",{key:"none",className:"chip"+(eff==="none"?" on":""),onClick:()=>setMarket("none")},"Nesledovat")));
    })(),
    (market||mktAuto(name)||"none")!=="none"&&e("div",{className:"muted",style:{fontSize:13,lineHeight:1.45}},"Hodnota se každý pracovní den posune podle ceny fondu"+(cur==="CZK"?" a kurzu eura":"")+(val===""?" od data nákupu":" od zadání současné hodnoty")+". Je to odhad."),
    inv&&inv.txId&&e("div",{className:"muted",style:{fontSize:13}},"Přidáno z platby. Změna ceny upraví i výdaj."),
    err&&e("div",{className:"err"},err),
    confirmDel&&e("div",{className:"confirm"},e("b",null,"Smazat investici "+(inv.name||"")+"?"),
      inv.txId&&e("span",{className:"muted"},"Výdaj v Platbách zůstane."),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{className:"btn small ghost",onClick:()=>setConfirmDel(false)},"Ponechat"),
        e("button",{className:"btn small danger",onClick:()=>onDelete(inv)},"Smazat")))
  );
}

// Bitcoin: kolik satoshi uživatel právě má (1 BTC = 100 000 000 sat). Hodnota se počítá z aktuální ceny.
// „Celkem vloženo“ je základ zadaný ručně; platby s poznámkou Bitcoin zapsané potom se přičítají samy (added).
function BtcSheet({btc,added,onSave,onClose}){
  const [v,setV]=useState(btc&&btc.sats?String(btc.sats):"");
  const [cost,setCost]=useState(btc&&btc.costCZK?String(btc.costCZK):"");
  const [err,setErr]=useState("");
  function save(){
    const n=Math.round(parseAmt(v));
    if(!(n>=0)||String(v).trim()===""){setErr("Zadej počet satoshi.");return;}
    const c=parseAmt(cost)>0?Math.round(parseAmt(cost)):undefined;
    // Když se změní vložená částka, platby se dál přičítají až od teď.
    const costAt=c===(btc&&btc.costCZK)&&btc&&btc.costAt?btc.costAt:(c?Date.now():undefined);
    onSave({sats:n,date:todayISO(),costCZK:c,costAt});
  }
  return e(Sheet,{title:"Kolik máš Bitcoinu?",onClose,footer:e("button",{className:"btn",onClick:save},"Uložit")},
    e("div",{className:"muted",style:{fontSize:14,lineHeight:1.5}},"Zadej přesný počet satoshi, které teď máš (najdeš ho na burze). Hodnotu v Kč aplikace počítá z aktuální ceny Bitcoinu."),
    e("div",null,e("div",{className:"amount-box"},
      e("input",{id:"btc-sats",type:"text",inputMode:"numeric",placeholder:"0",value:v,"aria-label":"Počet satoshi",style:{width:Math.max(1,v.length)+0.6+"ch"},onChange:ev=>{setV(ev.target.value);setErr("");}}),
      e("span",null,"sat")),err&&e("div",{className:"err"},err)),
    parseAmt(v)>0&&e("div",{className:"muted num",style:{fontSize:13,textAlign:"center"}},"= "+(parseAmt(v)/1e8).toLocaleString("cs-CZ",{maximumFractionDigits:8})+" BTC"),
    e(Field,{label:"Celkem vloženo (Kč)"},e("input",{className:"inp num",id:"btc-cost",inputMode:"decimal",placeholder:"nevyplněno",value:cost,onChange:ev=>setCost(ev.target.value)})),
    e("div",{className:"muted",style:{fontSize:13,lineHeight:1.45}},"Kolik jsi za Bitcoin celkem zaplatil. Platby s poznámkou „Bitcoin“, které zapíšeš potom, se k této částce přičtou samy. Z výsledku se počítá zisk v Majetku."),
    added>0&&e("div",{className:"muted num",style:{fontSize:13}},"Od zadání přibylo z plateb: +"+fmtCZK(added)+" (celkem "+fmtCZK((btc.costCZK||0)+added)+")"),
    btc&&btc.date&&e("div",{className:"muted",style:{fontSize:13}},"Naposledy zadáno "+parseISO(btc.date).toLocaleDateString("cs-CZ")+": "+Number(btc.sats).toLocaleString("cs-CZ")+" sat"));
}

// Stav peněz: od této částky se dál počítá hotovost (příjmy přičítá, výdaje odečítá).
function BalanceSheet({bal,current,onSave,onClose}){
  const [v,setV]=useState(bal?String(current).replace(".",","):"");
  const [date,setDate]=useState(todayISO());
  const [err,setErr]=useState("");
  function save(){
    if(String(v).trim()===""){setErr("Zadej částku.");return;}
    onSave({amount:parseAmt(v),date,at:Date.now()});
  }
  return e(Sheet,{title:"Kolik máš teď peněz?",onClose,footer:e("button",{className:"btn",onClick:save},"Uložit stav")},
    e("div",{className:"muted",style:{fontSize:14,lineHeight:1.5}},"Sečti peníze na účtech a v hotovosti (bez investic). Od tohoto stavu aplikace dál přičítá příjmy a odečítá výdaje, které zapíšeš. Když se časem rozejde se skutečností, zadej stav znovu."),
    e("div",null,e("div",{className:"amount-box"},
      e("input",{id:"bal-amount",type:"text",inputMode:"decimal",placeholder:"0",value:v,"aria-label":"Stav peněz v Kč",style:{width:Math.max(1,v.length)+0.6+"ch"},onChange:ev=>{setV(ev.target.value);setErr("");}}),
      e("span",null,"Kč")),err&&e("div",{className:"err"},err)),
    e(Field,{label:"Ke dni"},e(DateField,{value:date,onChange:setDate})),
    bal&&e("div",{className:"muted",style:{fontSize:13}},"Naposledy zadáno "+parseISO(bal.date).toLocaleDateString("cs-CZ")+": "+fmtCZK(bal.amount)));
}

// ── Pravidelné platby ───────────────────────────────────────────────────────
function RuleSheet({rule,data,onSave,onDelete,onClose}){
  const cfg=data.categories;
  const [type,setType]=useState(rule?rule.type:"expense");
  const [amount,setAmount]=useState(rule?String(rule.amount).replace(".",","):"");
  const [cat,setCat]=useState(rule?rule.category:"housing");
  const [note,setNote]=useState(rule?rule.note||"":"");
  const [day,setDay]=useState(rule?String(rule.day):String(new Date().getDate()));
  const [active,setActive]=useState(rule?rule.active:true);
  const [nowToo,setNowToo]=useState(false);
  const [invOn,setInvOn]=useState(rule&&rule.inv?!!rule.inv.enabled:true);
  const [invName,setInvName]=useState(rule&&rule.inv?rule.inv.name||"":"");
  const [invType,setInvType]=useState(rule&&rule.inv?rule.inv.type||"ETF":"ETF");
  const [err,setErr]=useState("");
  const [confirmDel,setConfirmDel]=useState(false);
  const cats=catList(type,cfg,false);
  const dnum=Math.max(1,Math.min(31,parseInt(day,10)||1));
  const isInv=type==="expense"&&cat==="investments";
  const passed=dnum<=new Date().getDate();
  function switchType(t){setType(t);const l=catList(t,cfg,false);if(!l.find(c=>c.id===cat))setCat(t==="income"?"salary":"housing");}
  function save(){
    const a=parseAmt(amount);
    if(a<=0){setErr("Zadej částku větší než 0.");return;}
    const cur=todayISO().slice(0,7);
    const r={...(rule||{id:newId(),startMonth:cur,lastMonth:passed&&!nowToo?cur:null}),
      type,amount:a,category:cat,note:note.trim(),day:dnum,active,
      inv:isInv?{enabled:invOn,name:invName.trim(),type:invType}:null};
    onSave(r);
  }
  return e(Sheet,{title:rule?"Pravidelná platba":"Nová pravidelná platba",onClose,footer:[
      rule&&e("button",{key:"d",className:"btn ghost","aria-label":"Smazat pravidelnou platbu",onClick:()=>setConfirmDel(true)},e(Icon,{n:"trash",size:20})),
      e("button",{key:"s",className:"btn",onClick:save},"Uložit")]},
    e(Seg,{cls:"exp",value:type,onChange:switchType,options:[{v:"expense",l:"Výdaj",c:"e"},{v:"income",l:"Příjem",c:"i"}]}),
    e("div",null,e("div",{className:"amount-box"},
      e("input",{type:"text",id:"rule-amount",inputMode:"decimal",placeholder:"0",value:amount,"aria-label":"Částka v Kč",style:{width:Math.max(1,amount.length)+0.6+"ch"},onChange:ev=>{setAmount(ev.target.value);setErr("");}}),
      e("span",null,"Kč")),err&&e("div",{className:"err"},err)),
    e(Field,{label:"Kategorie"},e(CatGrid,{cats,value:cat,onChange:setCat})),
    e("div",{className:"two"},
      e(Field,{label:"Název"},e("input",{className:"inp",id:"rule-note",placeholder:"Např. Nájem",value:note,onChange:ev=>setNote(ev.target.value)})),
      e(Field,{label:"Den v měsíci"},e("input",{className:"inp num",id:"rule-day",inputMode:"numeric",value:day,onChange:ev=>setDay(ev.target.value.replace(/\D/g,"").slice(0,2))}))),
    isInv&&e("div",{className:"inv-box"},
      e(Toggle,{on:invOn,onChange:setInvOn,title:"Zapisovat i do investic",sub:"Každá platba se přidá do Majetku."}),
      invOn&&e("input",{className:"inp",id:"rule-inv-name",placeholder:"Název investice",value:invName,onChange:ev=>setInvName(ev.target.value)}),
      invOn&&e("div",{className:"chips"},...INV_TYPES.map(t=>e("button",{key:t,className:"chip"+(invType===t?" on":""),onClick:()=>setInvType(t)},t)))),
    e(Toggle,{on:active,onChange:setActive,title:"Aktivní",sub:active?"Zapisuje se každý měsíc "+dnum+". den":"Pozastaveno, nic se nezapisuje"}),
    !rule&&passed&&e(Toggle,{on:nowToo,onChange:setNowToo,title:"Zapsat i tento měsíc",sub:dnum+". den už byl. Zapni, jestli jsi platbu tento měsíc ještě nezapsal ručně."}),
    confirmDel&&e("div",{className:"confirm"},e("b",null,"Smazat pravidelnou platbu?"),e("span",{className:"muted"},"Už zapsané platby zůstanou."),
      e("div",{style:{display:"flex",gap:8}},
        e("button",{className:"btn small ghost",onClick:()=>setConfirmDel(false)},"Ponechat"),
        e("button",{className:"btn small danger",onClick:()=>onDelete(rule)},"Smazat")))
  );
}

// ── Grafy ───────────────────────────────────────────────────────────────────
function Donut({items,total,sel,onSel,label}){
  const R=60,C=2*Math.PI*R;let off=0;
  return e("svg",{viewBox:"0 0 170 170",width:170,height:170,role:"img","aria-label":label+" "+fmtCZK(total)},
    e("circle",{cx:85,cy:85,r:R,fill:"none",stroke:"var(--card2)",strokeWidth:20}),
    ...items.map(it=>{
      const len=total?it.value/total*C:0;
      const el=e("circle",{key:it.id,cx:85,cy:85,r:R,fill:"none",stroke:it.color,strokeWidth:sel===it.id?26:20,
        strokeDasharray:Math.max(len-2,.5)+" "+C,strokeDashoffset:-off,transform:"rotate(-90 85 85)",
        opacity:sel&&sel!==it.id?.28:1,style:{cursor:"pointer",transition:"opacity .2s, stroke-width .2s"},onClick:()=>onSel(sel===it.id?null:it.id)});
      off+=len;return el;
    }),
    e("text",{x:85,y:79,textAnchor:"middle",className:"donut-l"},label),
    e("text",{x:85,y:99,textAnchor:"middle",className:"donut-v num"},fmtCZK(total)));
}
function MonthBars({rows}){
  const W=320,H=150,base=122,top=18;
  const max=Math.max(1,...rows.flatMap(r=>[r.inc,r.exp]));
  const step=W/rows.length,bw=Math.min(14,step/3.2);
  const y=v=>base-(v/max)*(base-top);
  return e("svg",{viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"Příjmy a výdaje za posledních 6 měsíců",style:{display:"block"}},
    e("line",{x1:0,x2:W,y1:top,y2:top,stroke:"var(--line)",strokeDasharray:"3 4"}),
    e("text",{x:W,y:top-5,textAnchor:"end",className:"chart-t"},fmtCompact(max)+" Kč"),
    e("line",{x1:0,x2:W,y1:base,y2:base,stroke:"var(--line)"}),
    ...rows.flatMap((r,i)=>{
      const cx=step*i+step/2,last=i===rows.length-1,op=last?1:.55;
      return [
        e("rect",{key:"i"+i,x:cx-bw-1.5,y:y(r.inc),width:bw,height:Math.max(base-y(r.inc),0),rx:3,fill:"var(--pos)",opacity:op}),
        e("rect",{key:"e"+i,x:cx+1.5,y:y(r.exp),width:bw,height:Math.max(base-y(r.exp),0),rx:3,fill:"var(--neg)",opacity:op}),
        e("text",{key:"t"+i,x:cx,y:base+16,textAnchor:"middle",className:"chart-t",style:last?{fill:"var(--fg)",fontWeight:700}:null},r.label)];
    }));
}

      e("span",{className:"num",style:{color}},fmtCZK(sum))),
    ...rows.map(r=>e("div",{key:r.id,className:"fixrow"},

// ── Aplikace ────────────────────────────────────────────────────────────────
function App(){
  const [data,setData]=useState(loadInitial);
  const now=new Date();
  const [tab,setTab]=useState("tx");
  const [month,setMonth]=useState(now.getMonth());
  const [year,setYear]=useState(now.getFullYear());
  const [txFilter,setTxFilter]=useState("all");
  const [query,setQuery]=useState("");
  const [catFilter,setCatFilter]=useState(null);
  const [anaType,setAnaType]=useState("expense");
  const [selCat,setSelCat]=useState(null);
  const [sheet,setSheet]=useState(null);
  const [toast,setToast]=useState("");
  const [importErr,setImportErr]=useState("");
  const [pendingImport,setPendingImport]=useState(null);
  const [showPlan,setShowPlan]=useState(false);
  const [openGrp,setOpenGrp]=useState(null);
  const [openRec,setOpenRec]=useState(false);
  const [mkt,setMkt]=useState(()=>{try{return JSON.parse(lsGet(MKT_KEY))||null;}catch{return null;}});
  const scrollRef=useRef(null);
  const fileRef=useRef(null);
  const cfg=data.categories;

  useEffect(()=>{lsSet(STORAGE,JSON.stringify(data));},[data]);
  useEffect(()=>{
    const f=()=>{if(document.visibilityState==="visible")setData(d=>applyRecurring(d));};
    document.addEventListener("visibilitychange",f);
    return()=>document.removeEventListener("visibilitychange",f);
  },[]);
  useEffect(()=>{
    const root=document.documentElement,th=data.settings.theme;
    if(th==="auto"){if(!window.WF_DEMO)root.removeAttribute("data-theme");}
    else root.setAttribute("data-theme",th);
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute("content",getComputedStyle(root).getPropertyValue("--bg").trim()||"#F4EFE6");
  },[data.settings.theme]);
  // Uzávěrky trhů: stáhnou se při otevření, nejvýš jednou za 3 hodiny. Bez signálu zůstanou poslední známé.
  const fundIds=[...new Set(data.investments.map(mktOf).filter(Boolean))];
  const btc=data.settings.btc;
  if(btc&&btc.sats>0)fundIds.push("btc");
  const mktIds=fundIds.length?[...fundIds,"eurczk","usdczk"].sort():[];
  // Data od nejstaršího nákupu, nejpozději ale od začátku minulého měsíce (kvůli pohybu od začátku měsíce).
  const prevMonth1=isoDate(new Date(new Date().getFullYear(),new Date().getMonth()-1,1));
  const mktFrom=[...data.investments.filter(i=>mktOf(i)).map(i=>i.curValue!=null&&i.curDate?i.curDate:i.date),prevMonth1].sort()[0];
  useEffect(()=>{
    if(!mktIds.length)return;
    function load(){
      if(document.visibilityState!=="visible")return;
      const c=mkt;
      if(c&&Date.now()-c.at<3*3600e3&&mktIds.every(id=>c.markets[id])&&c.od<=mktFrom)return;
      fetch("/api/trhy?trhy="+mktIds.join(",")+"&od="+mktFrom).then(r=>r.ok?r.json():null).then(j=>{
        if(!j||!j.markets||!Object.keys(j.markets).length)return;
        const next={at:Date.now(),od:mktFrom,markets:{...(c?c.markets:{}),...j.markets}};
        lsSet(MKT_KEY,JSON.stringify(next));setMkt(next);
      }).catch(()=>{});
    }
    load();
    document.addEventListener("visibilitychange",load);
    return()=>document.removeEventListener("visibilitychange",load);
  },[mktIds.join(","),mktFrom,mkt]);
  useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(""),1800);return()=>clearTimeout(t);},[toast]);
  useEffect(()=>{if(scrollRef.current)scrollRef.current.scrollTop=0;},[tab]);

  const upd=fn=>setData(d=>fn(d));
  const closeSheet=()=>setSheet(null);

  // ── Výpočty ──
  const mk=ym(year,month);
  const prevMk=ym(month===0?year-1:year,month===0?11:month-1);
  const inMonth=(t,k)=>String(t.date).slice(0,7)===k;
  const fil=data.transactions.filter(t=>inMonth(t,mk));
  const sumOf=(list,type)=>list.filter(t=>t.type===type).reduce((s,t)=>s+(Number(t.amount)||0),0);
  const totInc=sumOf(fil,"income"),totExp=sumOf(fil,"expense"),cf=totInc-totExp;
  const regInc=fil.filter(t=>t.type==="income"&&(t.regular||t.recurringId)).reduce((s,t)=>s+t.amount,0);
  // Hotovost: zadaný stav peněz k datu + pohyby zapsané po něm.
  // Bez zadaného stavu se počítá jako ve verzi 1 (startovní hodnota + vše).
  const bal=data.settings.balance;
  const afterBal=t=>t.date>bal.date||(t.date===bal.date&&t.created&&t.created>bal.at);
  const cashTx=bal?data.transactions.filter(afterBal):data.transactions;
  const cash=(bal?bal.amount:data.netWorthStart)+sumOf(cashTx,"income")-sumOf(cashTx,"expense");
  // Kurzy: poslední stažený kurz z trhu, jinak ruční kurz z Nastavení.
  const fxSer=cur=>{const m=FX_ID[cur]&&mkt&&mkt.markets[FX_ID[cur]];return m&&m.c.length?m:null;};
  const liveRate=cur=>{const m=fxSer(cur);return m?m.c[m.c.length-1]:null;};
  const rates={CZK:1,...data.settings.rates};
  ["EUR","USD"].forEach(c=>{const r=liveRate(c);if(r)rates[c]=Math.round(r*1000)/1000;});
  const invCost=i=>(Number(i.amount)||0)*(Number(i.qty)||1);
  const invManual=i=>i.curValue!=null?Number(i.curValue):invCost(i);
  // Hodnota podle denních cen titulu:
  // – pozice v měně titulu (z XTB): přesně kusy × cena,
  // – nákup zapsaný v Kč: částka posunutá o změnu ceny titulu a kurzu jeho měny od data nákupu (odhad).
  const invMkt=i=>{const id=mktOf(i),m=id&&mkt&&mkt.markets[id];return m&&m.c.length?m:null;};
  const invMktCur=i=>{const m=MARKETS.find(x=>x.id===mktOf(i));return m?m.cur:null;};
  const invExact=i=>i.curValue==null&&(i.currency||"CZK")===invMktCur(i);
  const invBaseDate=i=>i.curValue!=null&&i.curDate?i.curDate:i.date;
  const invAt=(i,m,day)=>{
    if(invExact(i))return (Number(i.qty)||1)*closeAt(m,day);
    const bd=invBaseDate(i);
    let r=closeAt(m,day)/closeAt(m,bd);
    const fx=(i.currency||"CZK")==="CZK"&&fxSer(invMktCur(i));
    if(fx)r*=closeAt(fx,day)/closeAt(fx,bd);
    return invManual(i)*r;
  };
  const invEst=i=>{
    const m=invMkt(i);if(!m)return null;
    const v=invAt(i,m,m.d[m.d.length-1]);
    return (i.currency||"CZK")==="CZK"?Math.round(v):Math.round(v*100)/100;
  };
  const invVal=i=>{const v=invEst(i);return v!=null?v:invManual(i);};
  // Pohyb od začátku měsíce: každý měsíc začíná od nuly. Výchozí bod = poslední uzávěrka před 1. dnem měsíce
  // (u nákupu z tohoto měsíce den nákupu). Počítá se v Kč včetně změny kurzu.
  const monthStart=isoDate(new Date(now.getFullYear(),now.getMonth(),1));
  const prevMonthEnd=isoDate(new Date(now.getFullYear(),now.getMonth(),0));
  const toCZK=(cur,day)=>{if(cur==="CZK")return 1;const f=fxSer(cur);return f?closeAt(f,day):(rates[cur]||1);};
  const invCZKAt=(i,m,day)=>invAt(i,m,day)*toCZK(i.currency||"CZK",day);
  const tracked=data.investments.filter(i=>invMkt(i));
  let mtdNow=0,mtdStart=0;
  tracked.forEach(i=>{
    const m=invMkt(i),last=m.d[m.d.length-1],bd=invBaseDate(i);
    mtdNow+=invCZKAt(i,m,last);
    mtdStart+=invCZKAt(i,m,bd>prevMonthEnd?bd:prevMonthEnd);
  });
  const mtdCZK=Math.round(mtdNow-mtdStart);
  // Řádek do zeleného rámečku na Domů: „Investice ▲ +1 234 Kč (+0,9 %)“ (nad řádky je „Od 1. 11.“).
  function moveLine(key,label,chg,base){
    return e("span",{key,className:"num",style:{fontSize:16,color:"var(--brand-sub)",whiteSpace:"nowrap"}},
      label+" ",
      e("b",{style:{color:"var(--brand-fg)"}},(chg>=0?"▲ +":"▼ −")+fmtCZK(Math.abs(chg))+(base?" ("+(chg>=0?"+":"−")+Math.abs(chg/base*100).toFixed(1).replace(".",",")+" %)":"")));
  }
  const dayLine=tracked.length>0&&moveLine("mtd","Investice",mtdCZK,mtdStart);
  // Rozbalovací řádky (Domů i Majetek): vidět je název a částka, podřádek až po klepnutí.
  // rows = [klíč, ikona, barva, název, podřádek, částka, malý text pod částkou]
  function foldRows(rows){
    return rows.filter(Boolean).flatMap(([k,icon,color,ttl,sub,amt,small])=>{
      const open=openGrp===k;
      return [e("button",{key:k,className:"row","aria-expanded":open,onClick:()=>setOpenGrp(open?null:k)},
          e("span",{className:"cic",style:{"--c":color,width:38,height:38}},e(Icon,{n:icon,size:21})),
          e("div",{className:"main"},e("div",{className:"ttl"},ttl)),
          e("div",{className:"amt num"},amt,small)),
        open&&sub&&e("div",{key:k+"-d",className:"muted num",style:{fontSize:13,padding:"0 0 10px 50px"}},sub)];
    }).filter(Boolean);
  }
  // Bitcoin je vždy vidět; podřádek: satoshi a cena v USD.
  // withGain: v Majetku pod částkou zisk oproti vložené částce (stejně jako u Investic).
  const btcRow=(k,withGain)=>{
    const c=btcCost,g=btcCZK-(c||0);
    return [k,"currency-btc","#C27A1A","Bitcoin",
      btc&&btc.sats>0?Number(btc.sats).toLocaleString("cs-CZ")+" sat"+(btcSer?" · "+fmtMoney(btcUSD,"USD"):"")+(c?" · vloženo "+fmtCZK(c):""):"Počet satoshi zadáš v Nastavení → Bitcoin.",
      btc&&btc.sats>0?(btcSer?fmtCZK(btcCZK):"…"):e("span",{className:"muted",style:{fontWeight:500}},"nezadáno"),
